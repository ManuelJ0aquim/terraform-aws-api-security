name: IaC Pipeline - Cost Estimation

on:
  pull_request:
    paths:
      - "**/*.tf"

jobs:
  cost-estimation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Permissão necessária para o Infracost comentar no PR
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Gerar Plano e Breakdown
        run: |
          cd infra
          terraform init
          terraform plan -out tfplan.binary
          terraform show -json tfplan.binary > plan.json
          infracost breakdown --path plan.json --format json --out-file /tmp/infracost.json

      - name: Postar Comentário no Pull Request
        uses: infracost/actions/comment@v10
        with:
          path: /tmp/infracost.json
          behavior: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
